# =============================================================================
# Taller Evaluativo 2 - Despliegue de StudyTrack (backend + frontend)
#
# Este stack es el que el Jenkinsfile ejecuta en su etapa "Deploy & Smoke
# Test" (Fase 4), usando las imágenes que la etapa "Publish to Nexus"
# acaba de publicar en su Docker Registry hosted.
#
# Complete los TODOs: red compartida, healthcheck del backend y la
# condición de arranque del frontend.
# =============================================================================
version: "3.9"

services:
  backend:
    image: localhost:9080/studytrack-backend:${IMAGE_TAG}
    container_name: studytrack-backend-prod
    ports:
      - "8080:8080"
    networks:
      - product-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/tasks"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: localhost:9080/studytrack-frontend:${IMAGE_TAG}
    container_name: studytrack-frontend-prod
    ports:
      - "3000:80"
    networks:
      - product-network
    depends_on:
      backend:
        condition: service_healthy

networks:
  product-network:
    driver: bridge