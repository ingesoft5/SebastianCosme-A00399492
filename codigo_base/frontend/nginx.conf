server {
    listen 3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Soporte de fallback SPA
        try_files $uri $uri/ /index.html;
    }

    # Opcional: cache agresiva para assets con hash de contenido (Vite).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
