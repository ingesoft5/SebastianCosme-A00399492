# =============================================================================
# Taller Evaluativo 2 - Fase 3: Orquestación del Ecosistema CI/CD
# Sonatype Nexus (repositorio de artefactos: maven-releases + docker-hosted)
#
# Complete los TODOs para levantar Nexus.
# =============================================================================
version: "3.9"

services:
  nexus:
    image: sonatype/nexus3:3.68.1
    container_name: nexus
    networks:
      - cicd_network
    ports:
      - "9081:8081" # Interfaz de Usuario (UI) de Nexus
      - "9080:8082" # Docker Registry (El puerto interno 8082 lo configurarás luego en la UI)
    volumes:
      - nexus_data:/nexus-data
    environment:
      - INSTALL4J_ADD_VM_PARAMS=-Xms1024m -Xmx1024m -XX:MaxDirectMemorySize=1024m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/service/rest/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  cicd_network:
    external: true

volumes:
  nexus_data:
